<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Volcano Sacrifice</title>
<link rel="stylesheet" href="../shared/base.css">
</head>
<body>
<script src="../vendor/three.global.js"></script>
<script src="../shared/sfx.js"></script>
<script src="../shared/roster.js"></script>
<script src="../shared/pickers.js"></script>
<script src="../shared/three-kit.js"></script>
<script src="../shared/app.js"></script>
<script>
(function () {
  const THREE = window.THREE;
  const st = Kit.stage({ fov: 50, exposure: 1.15, far: 900 });
  const S = st.scene;

  const sky = Kit.gradientSky([[0, '#050310'], [.45, '#1b0a2a'], [.78, '#5a1430'], [1, '#c2411c']]);
  S.background = sky;
  Kit.env(st, sky);
  S.fog = new THREE.FogExp2(0x21091f, 0.012);

  S.add(new THREE.AmbientLight(0x8a6fae, 1.05));
  S.add(new THREE.HemisphereLight(0xff7a3a, 0x241432, 0.95));
  const moon = new THREE.DirectionalLight(0xaec4ff, 1.9);
  moon.position.set(-20, 26, 14);
  moon.castShadow = true;
  moon.shadow.mapSize.set(2048, 2048);
  moon.shadow.camera.left = -30; moon.shadow.camera.right = 30;
  moon.shadow.camera.top = 30; moon.shadow.camera.bottom = -20;
  moon.shadow.camera.far = 90;
  S.add(moon);
  const lavaLight = new THREE.PointLight(0xff5a12, 30, 60, 2);
  lavaLight.position.set(0, 8.6, 0);
  S.add(lavaLight);

  // stars
  (function stars() {
    const g = new THREE.BufferGeometry();
    const pos = [];
    for (let i = 0; i < 900; i++) {
      const v = new THREE.Vector3(Kit.rnd(-1, 1), Kit.rnd(0, 1), Kit.rnd(-1, 1)).normalize().multiplyScalar(360);
      pos.push(v.x, v.y, v.z);
    }
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    S.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xfff0d0, size: 1.5, sizeAttenuation: true })));
  })();

  /* ---------- island ---------- */
  const ground = new THREE.Mesh(new THREE.CircleGeometry(90, 64),
    new THREE.MeshStandardMaterial({ color: 0x3a2438, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  S.add(ground);
  for (let i = 0; i < 60; i++) {                        // scattered rocks
    const r = new THREE.Mesh(new THREE.DodecahedronGeometry(Kit.rnd(.3, 1.1), 0),
      new THREE.MeshStandardMaterial({ color: 0x4d3350, roughness: 1, flatShading: true }));
    const a = Math.random() * 7, d = Kit.rnd(12, 46);
    r.position.set(Math.cos(a) * d, Kit.rnd(-.2, .3), Math.sin(a) * d);
    r.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    r.castShadow = true; r.receiveShadow = true;
    S.add(r);
  }

  /* ---------- the volcano ---------- */
  const CRATER_Y = 9.0, CRATER_R = 3.4;
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x5b3f56, roughness: .98, flatShading: true });
  const cone = new THREE.Mesh(new THREE.CylinderGeometry(CRATER_R + .8, 13, CRATER_Y, 26, 4, true), rockMat);
  (function roughen(m) {
    const p = m.geometry.attributes.position, v = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      const k = 1 + Math.sin(v.x * .9) * .04 + Math.cos(v.z * 1.1) * .04 + Math.random() * .03;
      p.setXYZ(i, v.x * k, v.y, v.z * k);
    }
    m.geometry.computeVertexNormals();
  })(cone);
  cone.position.y = CRATER_Y / 2;
  cone.castShadow = true; cone.receiveShadow = true;
  S.add(cone);
  const innerCone = new THREE.Mesh(new THREE.CylinderGeometry(CRATER_R, .5, 3.2, 26, 1, true),
    new THREE.MeshStandardMaterial({ color: 0x2a1522, roughness: .9, side: THREE.BackSide }));
  innerCone.position.y = CRATER_Y - 1.5;
  S.add(innerCone);

  const lavaMat = new THREE.MeshStandardMaterial({
    color: 0xff4d00, emissive: 0xff6a1a, emissiveIntensity: 2.6, roughness: .5
  });
  const lavaPool = new THREE.Mesh(new THREE.CircleGeometry(CRATER_R * .92, 40), lavaMat);
  lavaPool.rotation.x = -Math.PI / 2;
  lavaPool.position.y = CRATER_Y - 2.2;
  S.add(lavaPool);

  // lava running down the flanks — laid flat along the 44° slope
  const SLOPE = Math.atan2(13 - (CRATER_R + .8), CRATER_Y);
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2 + .3;
    const arm = new THREE.Group();
    arm.rotation.y = -a + Math.PI / 2;
    S.add(arm);
    const len = Math.hypot(13 - (CRATER_R + .8), CRATER_Y) * Kit.rnd(.55, .95);
    const streak = new THREE.Mesh(new THREE.PlaneGeometry(Kit.rnd(.45, 1.1), len),
      new THREE.MeshStandardMaterial({ color: 0xff5a10, emissive: 0xff8420, emissiveIntensity: 2.2, side: THREE.DoubleSide }));
    const midY = CRATER_Y * (1 - len / (2 * Math.hypot(13 - (CRATER_R + .8), CRATER_Y)));
    const midR = (CRATER_R + .8) + (13 - CRATER_R - .8) * (1 - midY / CRATER_Y) + .12;
    streak.position.set(0, midY, midR);
    streak.rotation.x = -SLOPE;
    arm.add(streak);
  }

  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: Kit.spark('rgba(255,140,40,1)', 'rgba(255,60,0,0)'),
    blending: THREE.AdditiveBlending, depthWrite: false, opacity: .8
  }));
  glow.scale.setScalar(14);
  glow.position.set(0, CRATER_Y, 0);
  S.add(glow);

  /* ---------- stone tablets ---------- */
  function tabletTexture(name) {
    return Kit.nameTexture(name, {
      w: 640, h: 400, bg: '#5b4a52', fg: '#1b1016', fill: .78, noiseAmt: 90,
      shadow: 'rgba(255,180,90,.9)', shadowBlur: 26,
      after(x, w, h) {
        x.strokeStyle = 'rgba(20,10,16,.5)'; x.lineWidth = 10;
        x.strokeRect(20, 20, w - 40, h - 40);
      }
    });
  }
  function makeTablet(name) {
    const g = new THREE.Group();
    const stone = Kit.box(1.5, .22, .95, 0x5b4a52, { roughness: 1, flatShading: true });
    g.add(stone);
    const face = new THREE.Mesh(new THREE.PlaneGeometry(1.42, .88),
      new THREE.MeshStandardMaterial({ map: tabletTexture(name).texture, roughness: .95 }));
    face.rotation.x = -Math.PI / 2;
    face.position.y = .13;
    g.add(face);
    g.userData.name = name;
    return g;
  }

  let tablets = [];
  function buildTablets() {
    tablets.forEach(t => S.remove(t));
    tablets = Roster.all().map(n => {
      const t = makeTablet(n);
      t.visible = false;
      S.add(t);
      return t;
    });
  }
  buildTablets();

  /* ---------- the returned offering ---------- */
  const plinth = Kit.cyl(1.5, 1.9, 1.1, 0x2e1e2c, 16, { roughness: 1, flatShading: true });
  plinth.position.set(0, .55, 17);
  S.add(plinth);
  let chosen = null;

  /* ---------- ambience ---------- */
  let tt = 0, idling = true;
  st.add(dt => {
    tt += dt;
    lavaMat.emissiveIntensity = 2.2 + Math.sin(tt * 2.3) * .5 + Math.sin(tt * 5.7) * .25;
    lavaLight.intensity = 26 + Math.sin(tt * 3.1) * 10;
    glow.material.opacity = .6 + Math.sin(tt * 1.7) * .18;
    glow.scale.setScalar(13 + Math.sin(tt * 1.3) * 1.6);
    if (Math.random() < dt * 2.2) {
      Kit.puffs(st, {
        origin: new THREE.Vector3(Kit.rnd(-1.6, 1.6), CRATER_Y - 1.4, Kit.rnd(-1.6, 1.6)),
        count: 2, color: 0xff8a30, speed: 2.4, dir: new THREE.Vector3(0, 1, 0),
        sizeMin: .5, sizeMax: 1.6, life: 2.4, gravity: 1.1, spread: .3
      });
    }
    if (idling) st.look([Math.cos(tt * .13) * 25, 12 + Math.sin(tt * .17) * 2.5, Math.sin(tt * .13) * 25], [0, 5.5, 0]);
    return true;
  });

  function resetScene() {
    Kit.clearTweens();
    buildTablets();
    if (chosen) { S.remove(chosen); chosen = null; }
    idling = true;
  }

  /* ---------- run ---------- */
  async function run(winner, api) {
    idling = false;
    buildTablets();
    const n = tablets.length;

    // Continue the idle orbit round to a head-on shot rather than snapping to a
    // fixed point on the far side of the mountain.
    const cam = Kit.chase(st, { rate: 3.2 });
    const from = st.rig.position.clone();
    const a0 = Math.atan2(from.x, from.z);
    api.caption('The volcano has been briefed.');
    await Kit.tween(1.8, t => {
      const a = a0 * (1 - t), r = 25 + t * 2;
      cam.to([Math.sin(a) * r, from.y + (11.4 - from.y) * t, Math.cos(a) * r], [0, 5.5 + t * 3.5, 0]);
    }, 'inOutCubic');

    // tablets rise into a ring over the crater
    api.caption('Offering the roster');
    SFX.rumble(2.4, .28);
    tablets.forEach((tab, i) => {
      const a = (i / n) * Math.PI * 2;
      const r = Math.max(6.2, n * .36);         // 1.5-wide tablets need ~2.2 of arc
      tab.position.set(Math.cos(a) * r, .4, Math.sin(a) * r);
      tab.visible = true;
      Kit.tween(1.1 + i * .05, t => {
        tab.position.y = .4 + t * (CRATER_Y + 3.4 - .4);
        tab.position.x = Math.cos(a + t * 1.3) * (r - t * 2.0);
        tab.position.z = Math.sin(a + t * 1.3) * (r - t * 2.0);
        tab.rotation.y = a + t * 3;
        tab.rotation.x = t * .25;
      }, 'outCubic');
      SFX.tone({ at: i * .05, freq: 200 + i * 40, dur: .3, type: 'triangle', gain: .06 });
    });
    await Kit.tween(1.5, t => {
      cam.to([0, 11.4 + t * 3.2, 27 - t * 10], [0, 9 + t * 2.2, 0], 2.4);
    }, 'inOutQuad');

    // in they go
    api.caption('In they go.');
    for (let i = 0; i < n; i++) {
      const tab = tablets[i];
      const p = tab.position.clone();
      Kit.tween(.7, t => {
        tab.position.set(p.x * (1 - t * .95), p.y - t * (p.y - (CRATER_Y - 2.4)), p.z * (1 - t * .95));
        tab.rotation.x += .3; tab.rotation.z += .17;
        tab.scale.setScalar(1 - t * .35);
      }, 'inQuad').then(() => {
        tab.visible = false;
        SFX.tone({ freq: 120, to: 50, dur: .25, type: 'sine', gain: .16 });
        SFX.noise({ dur: .5, freq: 900, to: 200, gain: .12 });
        Kit.puffs(st, {
          origin: new THREE.Vector3(0, CRATER_Y - 1.9, 0), count: 6, color: 0xffaa40,
          speed: 4, dir: new THREE.Vector3(0, 1, 0), sizeMin: .6, sizeMax: 2, life: 1.4, gravity: 1.4
        });
      });
      await Kit.wait(Math.max(90, 900 / n));
    }

    // building
    api.caption('The volcano is considering.');
    st.shake(.06, .995);
    SFX.rumble(3.2, .5);
    const growl = SFX.drone({ noise: true, type: 'lowpass', freq: 90, gain: .12, rate: .5 });
    await Kit.tween(2.2, t => {
      st.shake(.04 + t * .5, .995);
      lavaMat.emissiveIntensity = 2.5 + t * 6;
      lavaLight.intensity = 26 + t * 90;
      glow.scale.setScalar(13 + t * 18);
      lavaPool.position.y = CRATER_Y - 2.2 + t * 1.6;
      growl.filterTo(90 + t * 500, .2);
      cam.to([0, 14.2 - t * 1.5, 16 + t * 3], [0, 11.2, 0], 2.4);
    }, 'inQuad');

    /* ★ ERUPTION ★ */
    growl.stop(.4);
    SFX.explosion(.9);
    SFX.rumble(3.5, .55);
    st.shake(1.1, .93);
    const mouth = new THREE.Vector3(0, CRATER_Y - .4, 0);
    Kit.burst(st, {
      origin: mouth, count: 90, size: .34, speed: 20, gravity: -16, life: 3.4, jitter: 1.4,
      dir: new THREE.Vector3(0, 1, 0), spread: .75, floor: .2, bounce: .2,
      material: new THREE.MeshStandardMaterial({ color: 0xff5a12, emissive: 0xff7a20, emissiveIntensity: 2.2, roughness: .6, flatShading: true })
    });
    Kit.puffs(st, { origin: mouth, count: 46, color: 0xffb060, speed: 16, dir: new THREE.Vector3(0, 1, 0), spread: .45, sizeMin: 2, sizeMax: 6, life: 3.2, gravity: 3 });
    Kit.puffs(st, { origin: mouth, count: 30, color: 0x4a3648, speed: 10, dir: new THREE.Vector3(0, 1, 0), spread: .5, sizeMin: 4, sizeMax: 12, life: 5, gravity: 2, additive: false, opacity: .6 });
    lavaLight.intensity = 200;

    // one tablet comes back, on fire
    chosen = makeTablet(winner);
    chosen.position.copy(mouth);
    chosen.scale.setScalar(1);
    chosen.traverse(o => { if (o.material && o.material.emissive) { o.material.emissive = new THREE.Color(0xff5a10); o.material.emissiveIntensity = .9; } });
    S.add(chosen);
    const target = new THREE.Vector3(0, 1.15, 17);
    api.caption(null);

    Kit.tween(2.6, t => {
      cam.to([0, 12.7 - t * 7.5, 19 + t * 6], [0, 11.2 - t * 8.8, t * 13], 2.6);
    }, 'inOutCubic');

    await Kit.tween(1.9, t => {
      chosen.position.x = mouth.x + (target.x - mouth.x) * t;
      chosen.position.z = mouth.z + (target.z - mouth.z) * t;
      chosen.position.y = mouth.y + (target.y - mouth.y) * t + Math.sin(t * Math.PI) * 11;
      chosen.rotation.x += .16; chosen.rotation.y += .11; chosen.rotation.z += .07;
      Kit.puffs(st, { origin: chosen.position.clone(), count: 1, color: 0xff9a40, speed: .4, sizeMin: .4, sizeMax: 1.1, life: .9, gravity: .6 });
    }, 'linear');

    SFX.thud(.6);
    SFX.sizzle(1.4);
    st.shake(.3, .88);
    Kit.burst(st, { origin: target.clone(), count: 22, color: 0x5b4a52, size: .12, speed: 5, gravity: -14, life: 1.4, floor: 1.1 });
    await Kit.tween(.55, t => {
      chosen.rotation.set(Kit.ease.outBounce(t) * 0, 0, 0);
      chosen.position.y = 1.15 + (1 - Kit.ease.outBounce(t)) * .5;
      chosen.scale.setScalar(1 + (1 - t) * .3);
    }, 'linear');
    chosen.rotation.set(0, 0, 0);

    SFX.ding(700);
    await Kit.tween(1.4, t => {
      cam.to([0, 5.2 - t * 1.9, 25 - t * 4.2], [0, 1.5, 17], 2.2);
    }, 'inOutQuad');
    await Kit.wait(700);
    cam.stop();
  }

  Picker.init({
    key: 'volcano',
    kicker: 'Rejected by the mountain',
    tagline: 'The mountain keeps what it wants and spits back whoever has to talk.',
    goLabel: 'Make the offering',
    againLabel: 'Anger it again',
    verdict: n => `The volcano wanted nothing to do with ${n}. ${n} goes first.`,
    run,
    reset: resetScene
  });
})();
</script>
</body>
</html>
