<script src="../vendor/three.global.js"></script>
<script src="../shared/sfx.js"></script>
<script src="../shared/roster.js"></script>
<script src="../shared/pickers.js"></script>
<script src="../shared/three-kit.js"></script>
<script src="../shared/people.js"></script>
<script src="../shared/app.js"></script>
<script>
(function () {
  const THREE = window.THREE;

  /* ---------- stage ---------- */
  const st = Kit.stage({ fov: 50, bg: 0x1a1030, fog: { color: 0x2a1440, near: 22, far: 110 }, exposure: 1.3 });
  const S = st.scene;

  // sunset sky, doubling as the environment map for the car's paintwork
  const skyTex = Kit.gradientSky([[0, '#1a0b3a'], [.45, '#5b1e63'], [.72, '#c2405a'], [.9, '#ff8a3d'], [1, '#ffc46b']]);
  S.background = skyTex;
  Kit.env(st, skyTex);

  S.add(new THREE.AmbientLight(0x9f8ac5, 0.7));
  S.add(new THREE.HemisphereLight(0xffb37a, 0x3a1c4e, 0.85));
  const sun = new THREE.DirectionalLight(0xffd0a0, 3.0);
  sun.position.set(-30, 26, 22);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -60; sun.shadow.camera.right = 22;
  sun.shadow.camera.top = 26; sun.shadow.camera.bottom = -14;
  sun.shadow.camera.far = 120;
  sun.shadow.bias = -0.0005;
  S.add(sun);
  const fill = new THREE.DirectionalLight(0x6a7bff, 1.1);
  fill.position.set(18, 8, -16);
  S.add(fill);

  /* ---------- road ---------- */
  const asphalt = new THREE.Mesh(
    new THREE.PlaneGeometry(320, 26),
    new THREE.MeshStandardMaterial({ color: 0x2b2b36, roughness: .95 })
  );
  asphalt.rotation.x = -Math.PI / 2;
  asphalt.position.x = -60;
  asphalt.receiveShadow = true;
  S.add(asphalt);

  const desert = new THREE.Mesh(
    new THREE.PlaneGeometry(500, 500),
    new THREE.MeshStandardMaterial({ color: 0x593263, roughness: 1 })
  );
  desert.rotation.x = -Math.PI / 2;
  desert.position.y = -0.02;
  desert.receiveShadow = true;
  S.add(desert);

  for (let i = 0; i < 40; i++) {
    const dash = Kit.box(3.2, .02, .34, 0xf0e6c0, { roughness: .8, emissive: 0x2a2410 });
    dash.position.set(-i * 8 - 4, .01, 0);
    dash.castShadow = false;
    S.add(dash);
  }
  /* ---------- pavements ---------- */
  const KERB_Z = 12.2, PAVE_Z = 18.5;
  [-1, 1].forEach(sz => {
    const kerb = Kit.box(320, .34, .5, 0x8e88a0, { roughness: .9 });
    kerb.position.set(-60, .17, sz * KERB_Z);
    kerb.castShadow = false; kerb.receiveShadow = true;
    S.add(kerb);
    const pave = Kit.box(320, .3, PAVE_Z - KERB_Z, 0x554d6b, { roughness: .95 });
    pave.position.set(-60, .15, sz * (KERB_Z + (PAVE_Z - KERB_Z) / 2));
    pave.castShadow = false; pave.receiveShadow = true;
    S.add(pave);
  });

  /* ---------- the city ---------- */
  // Two canvases per building style: one for the paintwork, one that is black
  // except for the lit windows, so only the windows glow at dusk.
  function windowMaps() {
    const [cc, xc] = Kit.makeCanvas(64, 64);
    const [ce, xe] = Kit.makeCanvas(64, 64);
    xc.fillStyle = '#241b3a'; xc.fillRect(0, 0, 64, 64);
    xe.fillStyle = '#000000'; xe.fillRect(0, 0, 64, 64);
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        const lit = Math.random() < .42;
        const col = lit ? (Math.random() < .82 ? '#ffcb7a' : '#9fd0ff') : '#140e22';
        xc.fillStyle = col; xc.fillRect(7 + c * 19, 7 + r * 19, 11, 12);
        xe.fillStyle = lit ? col : '#000000'; xe.fillRect(7 + c * 19, 7 + r * 19, 11, 12);
      }
    }
    const t1 = Kit.texFromCanvas(cc), t2 = Kit.texFromCanvas(ce);
    [t1, t2].forEach(t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.NearestFilter; });
    return [t1, t2];
  }
  const WINDOW_STYLES = [];
  for (let i = 0; i < 6; i++) WINDOW_STYLES.push(windowMaps());

  function addBuilding(x, z, w, h, d) {
    const [base, emis] = Kit.pickOne(WINDOW_STYLES);
    const map = base.clone(), emissiveMap = emis.clone();
    map.needsUpdate = emissiveMap.needsUpdate = true;
    map.repeat.set(Math.max(1, Math.round(w / 4)), Math.max(1, Math.round(h / 4)));
    emissiveMap.repeat.copy(map.repeat);
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({
        map, emissiveMap, emissive: 0xffffff, emissiveIntensity: 1.15, roughness: .85, metalness: .05
      }));
    b.position.set(x, h / 2, z);
    S.add(b);
    // roof furniture, so the skyline is not a row of flat lids
    if (h > 16 && Math.random() < .7) {
      const mast = Kit.cyl(.14, .18, Kit.rnd(2.5, 6), 0x2a2138, 6, { roughness: .9 });
      mast.position.set(x + Kit.rnd(-w / 4, w / 4), h + mast.geometry.parameters.height / 2, z);
      S.add(mast);
      const lamp = Kit.ball(.3, 0xff3355, 8, { emissive: 0xff2244, emissiveIntensity: 3, roughness: .4 });
      lamp.position.set(mast.position.x, h + mast.geometry.parameters.height, z);
      S.add(lamp);
      beacons.push(lamp);
    } else if (Math.random() < .5) {
      const box = Kit.box(Kit.rnd(2, 5), Kit.rnd(1, 2.5), Kit.rnd(2, 5), 0x2e2440, { roughness: .95 });
      box.position.set(x + Kit.rnd(-w / 4, w / 4), h + box.geometry.parameters.height / 2, z + Kit.rnd(-d / 4, d / 4));
      S.add(box);
    }
    return b;
  }
  const beacons = [];
  [-1, 1].forEach(sz => {
    // near terrace, then a taller row behind it for depth
    let x = -118;
    while (x < 44) {
      const w = Kit.rnd(9, 17);
      addBuilding(x + w / 2, sz * Kit.rnd(21, 25), w, Kit.rnd(9, 26), Kit.rnd(10, 16));
      x += w + Kit.rnd(1.5, 5);
    }
    x = -124;
    while (x < 48) {
      const w = Kit.rnd(11, 22);
      addBuilding(x + w / 2, sz * Kit.rnd(38, 52), w, Kit.rnd(20, 52), Kit.rnd(14, 22));
      x += w + Kit.rnd(3, 9);
    }
  });

  /* ---------- street lamps ---------- */
  // Far side only — the chase camera occupies the near pavement.
  const lampHeads = [];
  for (let i = 0; i < 20; i++) {
    const sz = -1;
    const x = -i * 9 - 3;
    const pole = Kit.cyl(.11, .16, 5.2, 0x3b3450, 8, { roughness: .6, metalness: .3 });
    pole.position.set(x, 2.9, sz * 15.2);
    pole.castShadow = true;
    S.add(pole);
    const arm = Kit.box(2.0, .14, .14, 0x3b3450, { roughness: .6, metalness: .3 });
    arm.position.set(x, 5.4, sz * 14.3);
    S.add(arm);
    const head = Kit.box(1.0, .26, .5, 0xfff0c0, { emissive: 0xffdf9a, emissiveIntensity: 2.6, roughness: .4 });
    head.position.set(x, 5.2, sz * 13.4);
    S.add(head);
    lampHeads.push(head);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: Kit.spark('rgba(255,214,140,1)', 'rgba(255,150,40,0)'),
      blending: THREE.AdditiveBlending, depthWrite: false, opacity: .5
    }));
    glow.scale.setScalar(6);
    glow.position.copy(head.position);
    S.add(glow);
  }

  /* ---------- the crowd ---------- */
  // The crowd that matters is on the far pavement, facing the road, because that
  // is what the impact camera looks across. Near-side ones sit outside the
  // camera's flight path so it cannot fly through them.
  const peds = [];
  function addPed(x, z, facing) {
    const p = People.make({ x, z, facing });
    p.fleeDir = z >= 0 ? 1 : -1;
    S.add(p.g);
    peds.push(p);
    return p;
  }
  for (let i = 0; i < 14; i++) addPed(Kit.rnd(-11, 8), -13.0 - Math.random() * 2.6, Math.PI / 2 + Kit.rnd(-.5, .5));
  for (let i = 0; i < 5; i++) addPed(Kit.rnd(-16, 6), 15.6 + Math.random() * 2.4, -Math.PI / 2 + Kit.rnd(-.5, .5));
  for (let i = 0; i < 9; i++) {
    const far = Math.random() < .6;
    addPed(Kit.rnd(-72, -20), far ? -(13 + Math.random() * 3) : 15.6 + Math.random() * 2.4, Kit.rnd(0, 6.28));
  }

  function startleCrowd() {
    peds.forEach(p => {
      p.mode = 'startle'; p.startle = 1;
      if (Math.random() < .55) setTimeout(() => { p.mode = 'run'; p.speed = 1; }, 260 + Math.random() * 420);
    });
  }

  let cityT = 0;
  st.add(dt => {
    cityT += dt;
    beacons.forEach((b, i) => {
      b.material.emissiveIntensity = Math.sin(cityT * 2 + i) > .4 ? 4 : .2;
    });
    peds.forEach(p => {
      if (p.mode === 'run') {
        // leg it, directly away from the road — but stop at the shopfronts
        p.g.position.z += p.fleeDir * dt * 6;
        p.g.rotation.y = p.fleeDir > 0 ? 0 : Math.PI;
        if (Math.abs(p.g.position.z - p.home.z) > 9) { p.mode = 'idle'; p.facing = p.fleeDir > 0 ? 0 : Math.PI; }
      }
      People.animate(p, cityT, dt);
    });
    return true;
  });

  /* ---------- the wall ---------- */
  const wallGroup = new THREE.Group();
  wallGroup.position.set(4.5, 0, 0);
  S.add(wallGroup);
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x9c99a8, roughness: .95 });
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.36, 4.6), wallMat);
      b.position.set(0, .7 + r * 1.4, -9 + c * 4.7 + (r % 2 ? .4 : 0));
      b.castShadow = true; b.receiveShadow = true;
      wallGroup.add(b);
    }
  }
  const sign = new THREE.Mesh(
    new THREE.PlaneGeometry(7.6, 2.6),
    new THREE.MeshStandardMaterial({
      map: Kit.nameTexture('DAILY STANDUP', {
        w: 1024, h: 350, bg: '#f5c400', fg: '#111', border: '#111', borderWidth: 26, radius: 18, fill: .84
      }).texture, roughness: .7
    })
  );
  sign.rotation.y = -Math.PI / 2;
  sign.position.set(-0.81, 4.4, 0);
  wallGroup.add(sign);

  /* ---------- the car ---------- */
  const CAR_COLOR = 0xff2e6d;
  const car = new THREE.Group();
  const carBody = new THREE.Group();       // crumples on impact
  car.add(carBody);
  S.add(car);

  const paint = { roughness: .3, metalness: .35 };
  const chassis = Kit.box(4.4, .78, 2.0, CAR_COLOR, paint);
  chassis.position.y = .82;
  carBody.add(chassis);
  const hood = Kit.box(1.5, .34, 1.9, CAR_COLOR, paint);
  hood.position.set(1.5, 1.14, 0);
  carBody.add(hood);
  const cabin = Kit.box(2.0, .78, 1.78, 0xffffff, { roughness: .1, metalness: .1, transparent: true, opacity: .55, color: 0x141428 });
  cabin.position.set(-.35, 1.6, 0);
  carBody.add(cabin);
  const roof = Kit.box(1.7, .16, 1.72, CAR_COLOR, paint);
  roof.position.set(-.35, 2.02, 0);
  carBody.add(roof);
  const bumper = Kit.box(.34, .5, 2.05, 0x2b2b38, { roughness: .5, metalness: .4 });
  bumper.position.set(2.32, .72, 0);
  carBody.add(bumper);

  // crash-test dummy chequers, because of course
  for (let i = 0; i < 3; i++) {
    const sq = Kit.box(.5, .5, .02, i % 2 ? 0xffffff : 0x111111, { roughness: .8 });
    sq.position.set(-1.2 + i * .55, 1.0, 1.01);
    carBody.add(sq);
  }

  const lights = [];
  [-1, 1].forEach(z => {
    const hl = Kit.ball(.19, 0xfff3c4, 16, { emissive: 0xfff0b0, emissiveIntensity: 2.4, roughness: .2 });
    hl.position.set(2.36, 1.02, z * .66);
    carBody.add(hl);
    const tl = Kit.box(.1, .22, .42, 0x330008, { emissive: 0xff1133, emissiveIntensity: 1.2 });
    tl.position.set(-2.24, 1.0, z * .68);
    carBody.add(tl); lights.push(tl);
  });
  const beam = new THREE.SpotLight(0xffe9b0, 60, 26, .6, .5, 1.4);
  beam.position.set(2.4, 1.05, 0);
  beam.target.position.set(20, 0.4, 0);
  carBody.add(beam); carBody.add(beam.target);

  /* the star of the show */
  const plateTex = Kit.nameTexture('•••', {
    w: 768, h: 260, bg: '#f3f4ef', fg: '#1b2f6b', border: '#1b2f6b', borderWidth: 18, radius: 16, fill: .78,
    after(x, w, h) {
      x.fillStyle = '#1b2f6b'; x.font = 'bold 26px Impact, sans-serif'; x.textAlign = 'center';
      x.fillText('CRASH TEST STATE', w / 2, 34);
      x.fillText('★ GOES FIRST ★', w / 2, h - 24);
    }
  });
  const plate = new THREE.Mesh(
    new THREE.BoxGeometry(1.34, .46, .05),
    [
      new THREE.MeshStandardMaterial({ color: 0xdddddd }), new THREE.MeshStandardMaterial({ color: 0xdddddd }),
      new THREE.MeshStandardMaterial({ color: 0xdddddd }), new THREE.MeshStandardMaterial({ color: 0xdddddd }),
      new THREE.MeshStandardMaterial({ map: plateTex.texture, roughness: .45 }),
      new THREE.MeshStandardMaterial({ color: 0x888888 })
    ]
  );
  plate.rotation.y = Math.PI / 2;
  plate.position.set(2.5, .78, 0);
  plate.castShadow = true;
  carBody.add(plate);

  const wheels = [];
  [[1.45, .78], [1.45, -.78], [-1.45, .78], [-1.45, -.78]].forEach(([x, z]) => {
    const w = Kit.cyl(.52, .52, .38, 0x15151c, 22, { roughness: .85 });
    w.rotation.x = Math.PI / 2;
    w.position.set(x, .52, z);
    const hub = Kit.cyl(.24, .24, .4, 0xc9c9d6, 12, { roughness: .3, metalness: .8 });
    hub.rotation.x = Math.PI / 2;
    hub.position.copy(w.position);
    carBody.add(w); carBody.add(hub);
    wheels.push({ w, hub });
  });

  /* ---------- helpers ---------- */
  const START_X = -46;
  function resetCar() {
    Kit.clearTweens();
    peds.forEach(p => { People.reset(p); p.facing = p.g.rotation.y; });
    car.position.set(START_X, 0, 0);
    car.rotation.set(0, 0, 0);
    carBody.position.set(0, 0, 0);
    carBody.rotation.set(0, 0, 0);
    carBody.scale.set(1, 1, 1);
    carBody.visible = true;
    hood.position.set(1.5, 1.14, 0); hood.rotation.set(0, 0, 0); hood.scale.set(1, 1, 1);
    bumper.position.set(2.32, .72, 0); bumper.rotation.set(0, 0, 0);
    wheels.forEach(({ w, hub }, i) => {
      const p = [[1.45, .78], [1.45, -.78], [-1.45, .78], [-1.45, -.78]][i];
      w.rotation.set(Math.PI / 2, 0, 0); w.position.set(p[0], .52, p[1]);
      hub.rotation.set(Math.PI / 2, 0, 0); hub.position.set(p[0], .52, p[1]);
      carBody.add(w); carBody.add(hub);
    });
    carBody.add(plate);
    plate.position.set(2.5, .78, 0);
    plate.rotation.set(0, Math.PI / 2, 0);
    plate.scale.setScalar(1);
    plateTex.draw('•••');
    lights.forEach(l => l.material.emissiveIntensity = 1.2);
    idle();
  }

  function fling(mesh, vel, spin, floor) {
    const v = vel.clone();
    st.add(dt => {
      v.y -= 22 * dt;
      mesh.position.addScaledVector(v, dt);
      mesh.rotation.x += spin.x * dt; mesh.rotation.y += spin.y * dt; mesh.rotation.z += spin.z * dt;
      if (mesh.position.y < floor) { mesh.position.y = floor; v.y *= -.42; v.x *= .82; v.z *= .82; spin.multiplyScalar(.7); }
      return true;
    });
  }

  /* ---------- idle camera ---------- */
  let idling = true;
  function idle() {
    idling = true;
    let t = 0;
    st.add(dt => {
      if (!idling) return false;
      t += dt;
      const r = 13;
      st.look([START_X + Math.cos(t * .22) * r, 3.6 + Math.sin(t * .3) * 1.1, Math.sin(t * .22) * r],
              [START_X + 0.4, 1.3, 0]);
      return true;
    });
  }
  resetCar();

  /* ---------- the run ---------- */
  async function run(winner, api) {
    idling = false;
    const reel = Roster.reel(26, winner);

    // 1. hero shot of the plate, names flickering
    st.look([START_X + 5.4, 1.15, 2.6], [START_X + 2.5, .9, 0]);
    api.caption('Selecting a crash test volunteer…');
    let ri = 0;
    const flick = setInterval(() => { plateTex.draw(reel[ri++ % reel.length]); SFX.tick(); }, 70);
    const engine = SFX.drone({ type: 'sawtooth', freq: 46, gain: .1 });
    await Kit.tween(1.5, t => {
      engine.node.frequency.value = 46 + t * 26;
      st.look([START_X + 5.4 - t * 2, 1.15 + t * .6, 2.6 + t * 2], [START_X + 2.5, .9, 0]);
    }, 'inOutQuad');

    // 2. rev, and swing round behind the car — no cuts, the drive picks this
    //    shot up exactly where this one leaves off
    SFX.tone({ freq: 60, to: 240, dur: .5, type: 'sawtooth', gain: .16, filter: 'lowpass', filterFreq: 700 });
    engine.node.frequency.setTargetAtTime(150, SFX.ctx().currentTime, .25);
    engine.vol(.16);
    api.caption('No brakes. No survivors. No volunteers.');
    const revFrom = [START_X + 3.4, 1.75, 4.6], revTo = [START_X - 8, 2.2, 9.5];
    const aimFrom = [START_X + 2.5, .9, 0], aimTo = [START_X + 4, 1.4, 0];
    await Kit.tween(.75, t => {
      st.look(revFrom.map((v, i) => v + (revTo[i] - v) * t),
              aimFrom.map((v, i) => v + (aimTo[i] - v) * t));
    }, 'inOutCubic');
    SFX.skid(.7);

    // 3. the drive
    const dist = 2.05 - START_X;
    let travelled = 0;
    api.caption('WITNESS ME');
    await Kit.tween(2.5, (t, dt, raw) => {
      travelled = dist * t;
      car.position.x = START_X + travelled;
      const speed = 26 * (0.35 + raw);
      wheels.forEach(({ w, hub }) => { w.rotation.y -= speed * dt; hub.rotation.y -= speed * dt; });
      engine.node.frequency.value = 150 + t * 190;
      car.position.y = Math.sin(raw * 26) * .03;
      car.rotation.z = Math.sin(raw * 19) * .012;
      // chase camera swinging round to a side-on impact view
      // tighter than before so the car fills the frame; ends exactly where the impact shot starts
      st.look([car.position.x - 8, 2.2 + t * 2.8, 9.5 + t * 2.5], [car.position.x + 4, 1.4 + t * .3, 0]);
    }, 'inQuad');

    /* 4. ★ IMPACT ★ */
    clearInterval(flick);
    plateTex.draw(winner);
    engine.stop(.08);
    SFX.crash(.85);
    SFX.glass();
    SFX.rumble(1.6, .3);
    SFX.cheer(1.6);
    startleCrowd();
    st.shake(.72, .90);
    api.caption(null);

    const crashX = car.position.x;
    const impact = new THREE.Vector3(crashX + 1.25, 1.1, 0);
    Kit.burst(st, { origin: impact, count: 64, color: 0x9c99a8, size: .3, speed: 12, gravity: -20, life: 2.4, floor: .1, jitter: .8 });
    Kit.burst(st, { origin: impact, count: 48, color: CAR_COLOR, size: .22, speed: 14, gravity: -20, life: 2.2, floor: .1, jitter: .7, metalness: .6 });
    Kit.burst(st, {
      origin: impact, count: 40, size: .12, speed: 15, gravity: -18, life: 1.6, jitter: .6,
      material: new THREE.MeshStandardMaterial({ color: 0xbfefff, roughness: .05, metalness: .1, transparent: true, opacity: .8 })
    });
    Kit.puffs(st, { origin: impact, count: 34, color: 0xffb070, speed: 7, sizeMin: 1.4, sizeMax: 4.5, life: 1.7, gravity: 2.6 });
    Kit.puffs(st, { origin: impact, count: 8, color: 0xfff0c0, speed: 2, sizeMin: 4, sizeMax: 9, life: .55, gravity: 3, jitter: .5, growMin: 6, growMax: 12 });
    Kit.puffs(st, { origin: impact, count: 24, color: 0x39323f, speed: 4.5, sizeMin: 3, sizeMax: 8, life: 3.0, gravity: 1.5, additive: false, opacity: .55 });

    // squash the front of the car, kick the whole body back
    for (let k = 0; k < 3; k++) {
      const slab = wallGroup.children[Math.floor(Math.random() * 25)];
      // mostly up and away down the road — a 4.6m slab flying at the lens blocks
      // the whole shot
      fling(slab, new THREE.Vector3(Kit.rnd(-7, -2.5), Kit.rnd(6, 11), Kit.rnd(-13, -5)),
            new THREE.Vector3(Kit.rnd(-5, 5), Kit.rnd(-4, 4), Kit.rnd(-7, 7)), .7);
    }
    // wheels pop off
    [0, 1].forEach(i => {
      const { w, hub } = wheels[i];
      S.attach(w); S.attach(hub);
      const v = new THREE.Vector3(Kit.rnd(-4, 2), Kit.rnd(7, 11), (i ? -1 : 1) * Kit.rnd(3, 6));
      fling(w, v, new THREE.Vector3(Kit.rnd(-8, 8), Kit.rnd(-8, 8), Kit.rnd(-14, 14)), .5);
      fling(hub, v.clone().multiplyScalar(1.02), new THREE.Vector3(6, 4, 9), .5);
    });

    // plate ejects into the camera in glorious slow motion
    st.camera.attach(plate);
    lights.forEach(l => l.material.emissiveIntensity = 4.5);
    SFX.alarm(4);

    Kit.tween(.16, t => {
      carBody.scale.x = 1 - t * .22;
      carBody.position.x = -t * .5;
      hood.rotation.z = t * 1.1; hood.position.y = 1.14 + t * .45;
      bumper.rotation.z = -t * .9; bumper.position.x = 2.32 + t * .5;
      car.rotation.z = -t * .18;
    }, 'outQuart');

    Kit.tween(2.2, t => {
      car.position.x = crashX - t * 3.6;
      car.rotation.y = t * .55;
      car.rotation.z = -.18 + Math.sin(t * 9) * .12 * (1 - t);
      car.position.y = Math.sin(t * Math.PI) * .7;
      st.look([crashX - 8 + t * 3, 5.0 - t * .5, 12 - t * 1.5], [crashX + 4 - t * 3.4, 1.7 + t * .2, 0]);
    }, 'outQuart');

    // Tumble end over end toward the lens, fast at first and settling face-on.
    // The old spin about the vertical axis spent its slow part edge-on, a white
    // slab across the middle of the frame.
    const p0 = plate.position.clone(), q0 = plate.quaternion.clone(), qFace = new THREE.Quaternion();
    const flip = new THREE.Quaternion(), X = new THREE.Vector3(1, 0, 0), dest = new THREE.Vector3(0, 0, -1.55);
    await Kit.tween(2.0, t => {
      const e = Kit.ease.outCubic(t);
      plate.position.lerpVectors(p0, dest, e);
      plate.quaternion.slerpQuaternions(q0, qFace, e);
      flip.setFromAxisAngle(X, (1 - e) * Math.PI * 4);
      plate.quaternion.multiply(flip);
      plate.scale.setScalar(1 + e * .18);
    }, 'linear');

    await Kit.tween(.5, t => {
      plate.position.set(0, 0, -1.55);
      plate.rotation.set(0, 0, 0);
      plate.scale.setScalar(1.18 + t * .05);
    }, 'outBack');
    SFX.ding(880);
    await Kit.wait(300);
  }

  Picker.init({
    key: 'car-crash',
    kicker: 'Sole survivor of the collision',
    stinger: () => SFX.sadTrombone(),
    tagline: 'Whoever’s number plate we scrape off the tarmac talks first.',
    goLabel: 'Floor it',
    againLabel: 'Wreck another',
    verdict: n => `${n}’s licence plate was recovered from the wreckage. ${n} goes first.`,
    run,
    reset: () => { resetCar(); }
  });
})();
</script>
</body>
</html>
